  #     - "5000:5000"

  # ffmpeg:
  #   build:
  #     context: ./containers/ffmpeg
  #   image: ffmpeg:latest
  #   container_name: ffmpeg
  #   hostname: ffmpeg
  #   volumes:
  #     - ./containers/ffmpeg/data:/data
  #   tty: true
  #   entrypoint: bash

  twicas-publisher:
    build:
      context: ./containers/publisher
    image: twicas-publisher:latest
    container_name: twicas-publisher
    hostname: twicas-publisher
    command: ["npm", "run", "start"]
    environment:
      - RABBITMQ_URL
      - RABBITMQ_PORT
      - RABBITMQ_USER
      - RABBITMQ_PASSWORD
      - PORT_NUM
    ports:
      - "18080:18080"

networks:
  default:
    name: twicas
